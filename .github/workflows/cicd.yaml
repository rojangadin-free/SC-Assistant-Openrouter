name: Test and Deploy SC Assistant

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sc-assistant-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - name: Install CPU runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
      - name: Run offline regressions
        env:
          STORE_BACKEND: file
          RERANKER_ENABLED: 'false'
          PINECONE_API_KEY: offline-test
          OPENROUTER_API_KEY: offline-test
          AWS_ACCESS_KEY_ID: offline-test
          AWS_SECRET_ACCESS_KEY: offline-test
          AWS_EC2_METADATA_DISABLED: 'true'
          FLASK_SECRET_KEY: offline-test-session-secret
          PYTHONDONTWRITEBYTECODE: '1'
        run: python run_tests.py
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION || secrets.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr
      - name: Build and publish immutable image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          REPOSITORY: ${{ secrets.ECR_REPO }}
        run: |
          : "${REGISTRY:?ECR login did not return a registry}"
          : "${REPOSITORY:?Set the ECR_REPO GitHub secret}"
          : "${GITHUB_SHA:?Missing commit SHA}"
          IMAGE="$REGISTRY/$REPOSITORY:$GITHUB_SHA"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

  deploy:
    needs: build
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION || secrets.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr
      - name: Readiness-gated, memory-aware rollout
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          REPOSITORY: ${{ secrets.ECR_REPO }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION || secrets.AWS_DEFAULT_REGION }}
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          COGNITO_USER_POOL_ID: ${{ secrets.COGNITO_USER_POOL_ID }}
          COGNITO_CLIENT_ID: ${{ secrets.COGNITO_CLIENT_ID }}
          COGNITO_CLIENT_SECRET: ${{ secrets.COGNITO_CLIENT_SECRET }}
          FLASK_SECRET_KEY: ${{ secrets.FLASK_SECRET_KEY }}
          GUNICORN_WORKERS: ${{ vars.GUNICORN_WORKERS || '3' }}
          GUNICORN_THREADS: ${{ vars.GUNICORN_THREADS || '12' }}
          STORE_BACKEND: dynamodb
          STORE_TABLE_NAME: ${{ vars.STORE_TABLE_NAME || 'SCAssistantStores' }}
          S3_BUCKET_NAME: ${{ vars.S3_BUCKET_NAME || 'sc-assistant-bucket2' }}
          RERANKER_ENABLED: 'false'
        run: |
          # Reconstruct locally: GitHub can discard secret-containing job outputs.
          : "${REGISTRY:?ECR login did not return a registry}"
          : "${REPOSITORY:?Set the ECR_REPO GitHub secret}"
          : "${GITHUB_SHA:?Missing commit SHA}"
          IMAGE="$REGISTRY/$REPOSITORY:$GITHUB_SHA"
          ENV_FILE="$(mktemp "$RUNNER_TEMP/sc-assistant-env.XXXXXX")"
          export ENV_FILE
          trap 'rm -f "$ENV_FILE"' EXIT
          python3 - <<'PY'
          import os
          names = ["AWS_ACCESS_KEY_ID", "AWS_SECRET_ACCESS_KEY", "AWS_REGION",
                   "PINECONE_API_KEY", "OPENROUTER_API_KEY", "COGNITO_USER_POOL_ID",
                   "COGNITO_CLIENT_ID", "COGNITO_CLIENT_SECRET", "FLASK_SECRET_KEY",
                   "GUNICORN_WORKERS", "GUNICORN_THREADS", "STORE_BACKEND",
                   "STORE_TABLE_NAME", "S3_BUCKET_NAME", "RERANKER_ENABLED"]
          with open(os.environ["ENV_FILE"], "w") as handle:
              for name in names:
                  value = os.environ.get(name, "")
                  if "\n" in value or "\r" in value:
                      raise ValueError("Invalid multiline environment value")
                  handle.write(name + "=" + value + "\n")
          os.chmod(os.environ["ENV_FILE"], 0o600)
          PY
          bash tools/deploy.sh --apply "$IMAGE" "$ENV_FILE"
