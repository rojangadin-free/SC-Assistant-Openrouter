name: Deploy Application Docker Image to EC2 instance

on:
  push:
    branches: [main]

concurrency:
  group: sc-assistant-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  Continuous-Integration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Set up deployment-tool Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Test student database deployment tools
        run: |
          python -B tests/test_student_database_deploy.py
          python -B tests/test_student_database_ssh.py

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPO }}
          IMAGE_TAG: latest
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .  
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          echo "::set-output name=image::$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

  Continuous-Deployment:
    needs: Continuous-Integration
    runs-on: [self-hosted, linux]
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Prepare and validate persistent student database
        env:
          IMAGE_URI: ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_REPO }}:latest
          COGNITO_USER_POOL_ID: ${{ secrets.COGNITO_USER_POOL_ID }}
        run: |
          set -euo pipefail
          docker pull "$IMAGE_URI"
          APP_UID=$(docker run --rm --network none --entrypoint python "$IMAGE_URI" -c 'import os; print(os.getuid())')
          if [ "$APP_UID" != "0" ]; then
            echo "The provisioning policy expects the current root-running Docker image. Configure ownership before changing Docker USER." >&2
            exit 1
          fi
          # This one-purpose, network-isolated init creates only the private leaf.
          # No recursive chmod/chown, volume pruning, seeding, or snapshot restore.
          docker run --rm --network none --user 0:0 --entrypoint python \
            --mount type=bind,source=/var/lib,target=/var/lib \
            "$IMAGE_URI" tools/deploy_student_database.py prepare-directory \
            --directory /var/lib/sc-assistant --require-root
          # Fail BEFORE stopping the serving container if bootstrap is missing or invalid.
          # Run the SSH transfer command once; later deployments retain this host's claims.
          docker run --rm --network none --entrypoint python \
            --mount type=bind,source=/var/lib/sc-assistant,target=/var/lib/sc-assistant \
            "$IMAGE_URI" tools/deploy_student_database.py check \
            --destination /var/lib/sc-assistant/dummy_students.sqlite3 \
            --pool-id "$COGNITO_USER_POOL_ID" --require-root

      - name: Run New Docker Container
        env:
          RERANKER_BACKEND: ${{ vars.RERANKER_BACKEND || 'openrouter' }}
          RERANKER_ENABLED: ${{ vars.RERANKER_ENABLED || 'true' }}
          RAG_DEBUG: ${{ vars.RAG_DEBUG || 'true' }}
        run: |
          set -euo pipefail
          CONTAINER_NAME="rag-app-container"
          IMAGE_URI="${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_REPO }}:latest"

          # Replace only this application, after database preflight has succeeded.
          if docker container inspect "$CONTAINER_NAME" >/dev/null 2>&1; then
            docker stop --time 130 "$CONTAINER_NAME"
            docker rm "$CONTAINER_NAME"
          fi
          docker run -d --name "$CONTAINER_NAME" --restart always \
            -p 8080:8080 \
            --mount type=bind,source=/var/lib/sc-assistant,target=/var/lib/sc-assistant \
            -e STUDENT_RECORDS_BACKEND=sqlite_demo \
            -e DUMMY_STUDENT_DB_PATH=/var/lib/sc-assistant/dummy_students.sqlite3 \
            -e WEB_INDEXING_ENABLED=true \
            -e AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}" \
            -e AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}" \
            -e AWS_DEFAULT_REGION="${{ secrets.AWS_DEFAULT_REGION }}" \
            -e AWS_REGION="${{ secrets.AWS_REGION }}" \
            -e PINECONE_API_KEY="${{ secrets.PINECONE_API_KEY }}" \
            -e OPENROUTER_API_KEY="${{ secrets.OPENROUTER_API_KEY }}" \
            -e RERANKER_BACKEND \
            -e RERANKER_ENABLED \
            -e OPENROUTER_RERANKER_MODEL_NAME \
            -e RAG_DEBUG \
            -e COGNITO_USER_POOL_ID="${{ secrets.COGNITO_USER_POOL_ID }}" \
            -e COGNITO_CLIENT_ID="${{ secrets.COGNITO_CLIENT_ID }}" \
            -e FLASK_SECRET_KEY="${{ secrets.FLASK_SECRET_KEY }}" \
            -e AGENTROUTER_API_KEY="${{ secrets.AGENTROUTER_API_KEY }}" \
            -e COGNITO_CLIENT_SECRET="${{ secrets.COGNITO_CLIENT_SECRET }}" \
            "$IMAGE_URI"
